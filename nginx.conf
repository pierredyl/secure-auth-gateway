# This file is mounted over /etc/nginx/nginx.conf, which REPLACES the image's
# config rather than extending it. Anything the nginx:alpine image sets and we
# don't restate is lost, and nginx falls back to its compiled-in defaults --
# which is how this stack ended up running a single worker process capped at 512
# connections. Restate what matters; don't rely on the image.
worker_processes      auto;      # compiled-in default is 1, not auto
worker_rlimit_nofile  65536;     # each connection costs an fd; 2 per proxied request

events {
    worker_connections  16384;   # compiled-in default is 512
    multi_accept        on;
}

http {
    # uct/urt are the two that matter under load: uct is the TCP connect to the
    # app, and it should read 0.000 once the upstream keepalive pool below is
    # working. If it doesn't, keepalive is silently not happening.
    # $pid identifies which worker served the request. Grouping by it answers
    # "is one worker owning all the slow requests" without adding any tooling.
    log_format  perf  '$remote_addr $status rt=$request_time '
                      'uct=$upstream_connect_time uht=$upstream_header_time '
                      'urt=$upstream_response_time ua=$upstream_addr us=$upstream_status '
                      'conn=$connection reqs=$connection_requests pid=$pid';

    # Buffered on purpose. nginx's default is an unbuffered write to the Docker
    # log pipe once per request, inside the event loop -- at a few thousand rps
    # that stalls every connection the worker owns. Set access_log off for pure
    # throughput runs.
    access_log  /dev/stdout  perf  buffer=64k flush=1s;
    error_log   /dev/stderr  notice;

    sendfile     on;
    tcp_nodelay  on;
    tcp_nopush   on;

    keepalive_timeout   75s;
    keepalive_requests  100000;  # default 1000 forces a reconnect storm at this rate

    upstream auth_gateway {
        # max_fails defaults to 1 with fail_timeout 10s, so one transient connect
        # failure would drop a third of capacity for ten seconds.
        server app1:8080 max_fails=3 fail_timeout=5s;
        server app2:8080 max_fails=3 fail_timeout=5s;
        server app3:8080 max_fails=3 fail_timeout=5s;

        # Without this nginx opens a fresh TCP connection per request and closes
        # it -- thousands of handshakes a second, one per request's latency.
        keepalive           128;
        # Must stay below the Go server's IdleTimeout (120s in cmd/api/main.go) so
        # nginx is the side that closes idle pooled connections. If Go closed
        # first we'd race its FIN against the next request and serve stray 502s.
        keepalive_timeout   60s;
        keepalive_requests  100000;
    }

    # Plaintext 80 does nothing but redirect. The refresh-token cookie is set
    # Secure (internal/handlers/auth.go), which browsers silently refuse to
    # store over plaintext — so serving real traffic here instead of a redirect
    # would leave the refresh flow quietly broken rather than obviously broken.
    server {
        listen  80  backlog=4096 reuseport;
        return  301 https://$host$request_uri;
    }

    server {
        listen  443  ssl  backlog=4096  reuseport;

        # Self-signed dev cert — see scripts/gen-dev-cert.sh. No public domain
        # exists for a real CA to issue against in this environment; clients
        # (browsers, curl -k, the load harness) skip verification accordingly.
        ssl_certificate      /etc/nginx/certs/dev.crt;
        ssl_certificate_key  /etc/nginx/certs/dev.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;

        # Calibration endpoint: nginx answers this itself and never touches the Go
        # app. Whatever throughput it reaches is the ceiling of everything that is
        # NOT our code — load generator, network, nginx. The service can never
        # measure faster than this, so if /api/v1/health and /nginx-noop top out at
        # the same number, we have never actually measured the Go app.
        location = /nginx-noop {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location / {
            proxy_pass  http://auth_gateway;

            # Both lines are required for the upstream keepalive above to engage.
            # HTTP/1.0 (the default) can't pool, and without blanking Connection
            # nginx forwards the client's hop-by-hop close header to the app.
            proxy_http_version  1.1;
            proxy_set_header    Connection "";

            proxy_set_header  Host               $host;
            proxy_set_header  X-Real-IP          $remote_addr;
            proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header  X-Forwarded-Proto  $scheme;

            proxy_connect_timeout  2s;
            proxy_read_timeout     30s;
            proxy_send_timeout     30s;
        }
    }

    # accepts and handled are identical unless a resource limit was hit, so
    # accepts - handled is a direct count of connections nginx dropped.
    server {
        listen  8081;

        location /nginx_status {
            stub_status;
            access_log off;
        }
    }
}
